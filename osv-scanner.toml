# glob and minimatch are fixed only in new major releases (glob 14.0.2,
# minimatch 11.0.1), while textlint requires glob ^13. textlint expands only
# the file patterns passed on its command line (the `lint` script in
# package.json), and it never hands glob an AbortSignal, so neither the
# cancellation bypass nor the pattern-driven DoS is reachable from untrusted
# input. Drop these entries once textlint moves to the fixed majors.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-31
reason = "Fixed only in glob 14, which textlint does not accept yet; textlint passes glob no AbortSignal"

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31
reason = "Fixed only in minimatch 11, which textlint's glob 13 does not accept yet; patterns come only from the textlint command line"
